<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNA-TS canonical template canary</title>
    <style>
      :root {
        color: #e8eef9;
        background: #152238;
        font-family: system-ui, sans-serif;
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(44rem, calc(100vw - 3rem)); }
      h1 { color: #6495ed; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .6rem 1rem; }
      dt { font-weight: 700; }
      dd { margin: 0; overflow-wrap: anywhere; }
      code { color: #b9d1ff; }
      .pass { color: #8ee6a5; }
      .blocked { color: #ffd479; }
      small { color: #b9c4d5; }
      @media (max-width: 34rem) {
        dl { grid-template-columns: 1fr; }
        dd { margin-bottom: .5rem; }
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Loading CNA-TS canary…</p></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
