plugins {
    id 'java'
    id 'application'
}

group = 'org.openeggbert.examples'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = findProperty('artifactId') ?: 'cna-java-template-game'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "org.openeggbert:cna-java:${findProperty('cnaVersion') ?: '0.1.0-SNAPSHOT'}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xlint:all', '-Werror'])
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.openeggbert.cna.template.Main'
}
